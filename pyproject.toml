[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "propstrata-engine"
version = "1.0.0"
description = "Enterprise Open-Source Real Estate & PropTech Marketplace Engine"
readme = "README.md"
authors = [{ name = "Ahmed Khaled (Ahmed Algendy)", email = "contact@ahmedalgendy.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "Django>=5.0",
    "djangorestframework>=3.14.0",
    "django-cors-headers>=4.3.0",
    "pydantic>=2.5.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "pillow>=10.2.0",
]

[project.scripts]
propstrata = "cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
